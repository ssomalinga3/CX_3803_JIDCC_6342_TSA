name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gis-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify original GIS source bytes and archive inventory
        run: python3 tools/gis/source_package.py verify
      - name: Source integrity and safe extraction regression checks
        run: python3 -m unittest discover -s tools/gis -p 'test_source_package.py'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
      - name: Source conversion regression and reproducibility checks
        run: |
          uv run --locked --project tools/gis python -m unittest discover -s tools/gis -p 'test_convert_trails.py'
          uv run --locked --project tools/gis python tools/gis/convert_trails.py --check
          uv run --locked --project tools/gis python -m unittest discover -s tools/gis -p 'test_convert_pdf_map.py'
          uv run --locked --project tools/gis python tools/gis/convert_pdf_map.py --check
          uv run --locked --project tools/gis python -m unittest discover -s tools/gis -p 'test_convert_terrain.py'
          uv run --locked --project tools/gis python tools/gis/convert_terrain.py --check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Worker types
        run: pnpm --dir backend cf:typegen
      - name: format:check
        run: pnpm format:check
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: test:ci
        if: ${{ !cancelled() }}
        run: pnpm test:ci
      - name: bundle:check
        if: ${{ !cancelled() }}
        run: pnpm bundle:check

  backend-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Process and CLI portability checks
        run: pnpm --dir backend test --ci --runInBand --runTestsByPath test/process-tools.test.ts
      - name: Worker startup, failure response and process-tree cleanup (no Docker required)
        run: pnpm --dir backend exec node scripts/test-worker.mjs --database-unavailable

  backend-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      GIS_SOURCE_MAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up local PostGIS and apply Drizzle migrations
        run: pnpm backend:setup
      - name: Verify migration replay
        run: pnpm --dir backend db:migrate
      - name: Seed synthetic demo GIS (twice to verify repeatability)
        run: pnpm --dir backend db:seed && pnpm --dir backend db:seed
      - name: Import source map (twice to verify repeatability)
        run: pnpm --dir backend db:import:source && pnpm --dir backend db:import:source
      - name: Replay supplied trails and verify legacy command selects them
        run: pnpm --dir backend db:import:trails && pnpm --dir backend db:import:pdf && pnpm --dir backend db:import:boundary && pnpm --dir backend db:import:terrain && pnpm --dir backend db:import:source
      - name: Jest integration against PostGIS
        run: pnpm --dir backend test:integration
      - name: Build and test the Worker against PostGIS
        run: pnpm backend:check
      - name: Database diagnostics
        if: failure()
        run: docker compose -f backend/docker-compose.yml logs db
      - name: Stop local database
        if: always()
        run: pnpm --dir backend db:down
